name: Vitalis Release & APK Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Run Quality Gate Verification
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --pub --android-skip-build-dependency-validation

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Vitalis Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
