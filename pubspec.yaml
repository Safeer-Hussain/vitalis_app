name: vitalis_app
description: "Vitalis - Flagship Digital Healthcare, Telemedicine, Biomarker Diagnostics & AI Clinical Triage Ecosystem."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  fl_chart: ^0.70.2
  dio: ^5.8.0+1
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/doctors/
    - assets/images/devices/
